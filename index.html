<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胖嘟柴柴點餐平台</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#243247;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}header{background:#0284c7;color:white;padding:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}header strong{font-size:19px}main{max-width:850px;margin:20px auto;padding:0 14px}.card{background:white;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px #0001}h2{font-size:19px;color:#0369a1}button,select,input,textarea{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#0284c7;color:white;border:0}button:disabled{opacity:.5;cursor:not-allowed}.danger{background:#dc2626}.gray{background:#64748b}.green{background:#059669}input,select{max-width:100%;width:100%}label{display:block;font-weight:600;margin:10px 0 5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.item{border-bottom:1px solid #e5e7eb;padding:13px 0}.itemhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:38px;flex:none}.opts{font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.opts label{margin:0;font-weight:400}.opts input{width:auto}.foot{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:12px;display:flex;justify-content:center;gap:24px;align-items:center}.hidden{display:none!important}.muted{color:#64748b;font-size:13px}.pill{display:inline-block;padding:3px 8px;background:#e0f2fe;border-radius:20px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}.scroll{overflow:auto}.dog{max-width:400px;width:100%;height:auto;display:block;margin:20px auto;border-radius:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px}details{margin:12px 0;border:1px solid #ddd;border-radius:10px;padding:10px}summary{cursor:pointer;font-weight:bold}.status{background:#e0f2fe;border-radius:8px;padding:10px;margin:12px 0}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:100;background:#0f172a;color:white;padding:12px 18px;border-radius:8px;display:none;max-width:95vw}#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;padding:12px}body{padding:0;background:white}}
</style></head><body>
<header><strong>🐕 胖嘟柴柴點餐平台</strong><div style="min-width:210px;flex:1;max-width:450px"><select id="eventSelect" onchange="chooseEvent()"><option value="">🏠 首頁／訂餐須知</option></select></div><button class="gray" onclick="openAdmin()">管理員</button></header>
<main><div id="notice" class="card"><h2>🐾 歡迎使用胖嘟柴柴點餐平台</h2><p>請從上方下拉選單選擇 LINE 投票結果的店家與日期。可提前訂購未來數日的餐點。</p><p>請填寫姓名或綽號、完整部門。各場次預設在點餐當日上午 10:30 截止；如有特殊需求請聯絡管理員。</p><p>訂餐完成後請務必保存「查詢碼」，日後查詢及取消訂單時需要使用。現場領餐並付款。</p><img class="dog" src="dog.png" alt="胖嘟柴柴" onerror="this.style.display='none'"></div>
<div id="orderPage" class="hidden"><div class="card"><h2 id="storeTitle">選擇餐點</h2><div id="deadline" class="status"></div><label>姓名或綽號</label><input id="name" maxlength="40" placeholder="請輸入姓名"><label>完整部門</label><input id="dept" maxlength="40" placeholder="請輸入部門"></div><div class="card"><h2>菜單</h2><div id="menu"></div></div></div>
<div class="card"><h2>🔎 查詢／取消訂單</h2><p class="muted">為保護同事資料，需使用下單成功時取得的查詢碼。</p><div class="row"><div><label>姓名</label><input id="queryName"></div><div><label>部門</label><input id="queryDept"></div></div><label>查詢碼</label><input id="lookupKey" placeholder="貼上下單時保存的查詢碼"><button style="margin-top:10px" onclick="lookup()">查詢我的訂單</button><div id="lookupResult"></div></div>
<div id="adminLogin" class="card hidden"><h2>管理員登入</h2><input id="adminPass" type="password" placeholder="管理員密碼"><button style="margin-top:10px" onclick="login()">登入</button></div>
<div id="adminPanel" class="hidden"><div class="card"><h2>🛠 管理員後台</h2><div class="row"><div><label>新增點餐日期</label><input id="eventDate" type="date"></div><div><label>投票結果店家</label><select id="storePicker"></select></div></div><button style="margin-top:10px" onclick="adminAction('addEvent',{date:val('eventDate'),store:val('storePicker')})">發起開放</button><button class="gray" onclick="loadAdmin()">重新整理資料</button><button class="gray" onclick="logout()">登出</button></div><div class="card"><h2>場次與批次管理</h2><div id="adminEvents"></div></div><div class="card"><h2>場次訂單／LINE 報餐／列印</h2><label>選擇場次</label><select id="adminEvent" onchange="renderAdminOrders()"></select><div id="stats" class="status"></div><div class="actions"><button onclick="copySummary()">複製 LINE 報餐</button><select id="batchFilter" onchange="renderAdminOrders()" style="width:auto"><option value="all">全部批次</option><option value="1">第1單</option><option value="2">第2單</option><option value="3">第3單</option></select><button class="green" onclick="printChecklist()">列印收款對帳單</button></div><div id="adminOrders" class="scroll"></div></div></div>
</main><div id="footer" class="foot hidden"><strong>合計 $<span id="total">0</span></strong><button id="submitBtn" onclick="submitOrder()">確認送出點餐</button></div><div id="toast"></div><div id="printArea"></div>
<script>
// 必須替換成你自己新部署的 Apps Script /exec 網址
const API_URL='請貼上你的_APPS_SCRIPT_EXEC_網址';
let events=[],stores={},selected='',cart={},adminToken='',adminOrders=[],adminEvents=[];let busy=false;
const el=id=>document.getElementById(id),val=id=>el(id).value.trim(),money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
function say(s){el('toast').textContent=s;el('toast').style.display='block';setTimeout(()=>el('toast').style.display='none',4500)}
function text(tag,value){const x=document.createElement(tag);x.textContent=value;return x}
async function api(payload){if(!API_URL.startsWith('https://script.google.com/'))throw Error('請先設定 API_URL');const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(payload),redirect:'follow'});const data=await r.json();if(data.status!=='success')throw Error(data.message||'伺服器拒絕操作');return data}
function setOptions(select,options,placeholder){select.replaceChildren(new Option(placeholder,''));options.forEach(x=>select.add(new Option(x.label,x.value)))}
async function refresh(){try{let r=await api({action:'public'});events=r.events;stores=r.stores;setOptions(el('eventSelect'),events.filter(e=>e.status!=='ARCHIVED').map(e=>({label:e.date+' '+e.store+(e.isOpen?'':'（已截止）'),value:e.id})),'🏠 首頁／訂餐須知');setOptions(el('storePicker'),Object.keys(stores).map(s=>({label:s,value:s})),'請選擇店家');if(selected&&events.some(e=>e.id===selected)){el('eventSelect').value=selected;chooseEvent()}else{selected='';chooseEvent()}}catch(e){say('載入失敗：'+e.message)}}
function chooseEvent(){selected=el('eventSelect').value;cart={};let ev=events.find(e=>e.id===selected);el('notice').classList.toggle('hidden',!!ev);el('orderPage').classList.toggle('hidden',!ev);el('footer').classList.toggle('hidden',!ev);if(!ev)return;el('storeTitle').textContent=ev.date+' '+ev.store;el('deadline').textContent=ev.isOpen?'🟢 開放點餐中，當日 10:30 截止（依後端為準）':'🔴 場次目前不開放點餐';el('submitBtn').disabled=!ev.isOpen;renderMenu(ev);}
function renderMenu(ev){const root=el('menu');root.replaceChildren();(stores[ev.store]||[]).forEach(([category,items])=>{root.append(text('h3',category));items.forEach(([name,price])=>{let key=name,entry=cart[key]||{qty:0,options:[],remark:''};let box=document.createElement('div');box.className='item';let head=document.createElement('div');head.className='itemhead';let info=document.createElement('div');info.append(text('strong',name),text('div',money(price)));let controls=document.createElement('div');controls.className='qty';let minus=text('button','−'),qty=text('strong',String(entry.qty)),plus=text('button','+');minus.onclick=()=>changeQty(key,-1,ev);plus.onclick=()=>changeQty(key,1,ev);controls.append(minus,qty,plus);head.append(info,controls);box.append(head);if(entry.qty>0){let allowed=[];if(ev.store==='竹林雞肉（中華店）'&&category==='飯類'&&name!=='雞油飯')allowed=name==='全菜不飯'?['加半熟蛋','加全熟蛋']:name==='菜飯'?['半飯','加半熟蛋','加全熟蛋']:['半飯','不雞油','全熟蛋','額外加一顆蛋'];if(allowed.length){let opts=document.createElement('div');opts.className='opts';allowed.forEach(o=>{let label=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=entry.options.includes(o);c.onchange=()=>{if(c.checked&&['加半熟蛋','加全熟蛋'].includes(o))entry.options=entry.options.filter(x=>!['加半熟蛋','加全熟蛋'].includes(x));entry.options=c.checked?[...entry.options,o]:entry.options.filter(x=>x!==o);renderMenu(ev)};label.append(c,document.createTextNode(o+(o.includes('加')? ' (+15元)':'')));opts.append(label)});box.append(opts)}let remark=document.createElement('input');remark.placeholder='備註（例如：不要辣）';remark.maxLength=120;remark.value=entry.remark;remark.oninput=()=>entry.remark=remark.value;box.append(remark)}root.append(box)})});calc()}
function changeQty(k,n,ev){if(!ev.isOpen)return say('場次已截止');if(!cart[k])cart[k]={qty:0,options:[],remark:''};cart[k].qty=Math.max(0,Math.min(30,cart[k].qty+n));if(!cart[k].qty)delete cart[k];renderMenu(ev)}
function orderItems(){return Object.entries(cart).filter(([k,v])=>v.qty>0).map(([name,v])=>({name,qty:v.qty,options:v.options,remark:v.remark}))}
function calc(){let ev=events.find(e=>e.id===selected),catalog={};if(ev)(stores[ev.store]||[]).forEach(([c,items])=>items.forEach(([n,p])=>catalog[n]=p));let total=orderItems().reduce((s,i)=>s+i.qty*(catalog[i.name]+i.options.filter(o=>['加半熟蛋','加全熟蛋','額外加一顆蛋'].includes(o)).length*15),0);el('total').textContent=total.toLocaleString('zh-TW');return total}
async function submitOrder(){if(busy)return;let ev=events.find(e=>e.id===selected);if(!ev||!ev.isOpen)return say('未開放點餐');if(!val('name')||!val('dept'))return say('請填姓名與部門');let items=orderItems();if(!items.length)return say('請選擇餐點');if(!confirm(`確定送出 ${ev.date} ${ev.store}，總額 ${money(calc())}？`))return;busy=true;el('submitBtn').disabled=true;try{let r=await api({action:'submit',eventId:selected,name:val('name'),dept:val('dept'),items});let receipt=`胖嘟柴柴訂餐成功\n${ev.date} ${ev.store}\n姓名：${val('name')}\n部門：${val('dept')}\n金額：${money(r.total)}\n訂單ID：${r.id}\n查詢碼：${r.lookupKey}\n請保存查詢碼，查詢與取消時必須使用。`;localStorage.setItem('pangdu_last_receipt',receipt);el('lookupKey').value=r.lookupKey;el('queryName').value=val('name');el('queryDept').value=val('dept');alert(receipt);if(navigator.clipboard)navigator.clipboard.writeText(receipt).catch(()=>{});cart={};renderMenu(ev);say('訂單已送出，請保存查詢碼')}catch(e){say('送出失敗：'+e.message)}finally{busy=false;el('submitBtn').disabled=!ev.isOpen}}
async function lookup(){let root=el('lookupResult');root.replaceChildren();try{let r=await api({action:'lookup',name:val('queryName'),dept:val('queryDept'),lookupKey:val('lookupKey')});if(!r.orders.length){root.append(text('p','查無訂單，請確認資料與查詢碼'));return}r.orders.forEach(o=>{let ev=events.find(e=>e.id===o.eventId);let card=document.createElement('div');card.className='card';card.append(text('h3',(ev?ev.date+' '+ev.store:o.eventId)+' '+money(o.total)+' '+o.status));o.items.forEach((i,j)=>{let line=document.createElement('div');line.className='item';line.append(text('span',`${i.name} ×${i.qty} ${i.options.join('、')} ${i.remark} ${i.cancelled?'（已取消）':''}`));if(!i.cancelled&&o.status==='ACTIVE'){let b=text('button','取消此品項');b.className='danger';b.onclick=()=>cancel(o.id,j);line.append(b)}card.append(line)});if(o.status==='ACTIVE'){let b=text('button','取消整筆訂單');b.className='danger';b.onclick=()=>cancel(o.id,null);card.append(b)}root.append(card)})}catch(e){say('查詢失敗：'+e.message)}}
async function cancel(id,itemIndex){if(!confirm('確定取消？'))return;try{await api({action:'cancel',id,itemIndex,lookupKey:val('lookupKey')});say('取消成功');await lookup()}catch(e){say('取消失敗：'+e.message)}}
function openAdmin(){el('adminLogin').classList.toggle('hidden');el('adminLogin').scrollIntoView({behavior:'smooth'})}
async function login(){try{let r=await api({action:'login',password:val('adminPass')});adminToken=r.token;el('adminPass').value='';el('adminLogin').classList.add('hidden');el('adminPanel').classList.remove('hidden');await loadAdmin()}catch(e){say(e.message)}}
function logout(){adminToken='';adminOrders=[];el('adminPanel').classList.add('hidden');say('已登出')}
async function loadAdmin(){try{let r=await api({action:'adminData',token:adminToken});adminEvents=r.events;adminOrders=r.orders;renderAdminEvents();let old=val('adminEvent');setOptions(el('adminEvent'),adminEvents.map(e=>({value:e.id,label:e.date+' '+e.store})),'選擇場次');if(adminEvents.some(e=>e.id===old))el('adminEvent').value=old;else if(adminEvents.length)el('adminEvent').value=adminEvents[0].id;renderAdminOrders();await refresh()}catch(e){say('管理資料載入失敗：'+e.message)}}
async function adminAction(type,extra){if(!adminToken)return say('請先登入');if(['settle','cancelOrder'].includes(type)&&!confirm('確定執行這項管理操作？'))return;try{await api({action:'adminAction',token:adminToken,type,...extra});say('操作成功');await loadAdmin()}catch(e){say('操作失敗：'+e.message)}}
function renderAdminEvents(){let root=el('adminEvents');root.replaceChildren();adminEvents.forEach(e=>{let d=document.createElement('details'),s=text('summary',`${e.date} ${e.store}｜${e.status}｜第 ${e.batch} 單｜已結算：${e.closedBatches.join('、')||'無'}`);d.append(s);let bar=document.createElement('div');bar.className='actions';[['開放','OPEN'],['關閉','CLOSED'],['封存','ARCHIVED']].forEach(([label,value])=>{let b=text('button',label);b.className=value==='CLOSED'?'danger':'gray';b.onclick=()=>adminAction('setStatus',{eventId:e.id,value});bar.append(b)});let b=text('button','結算第 '+e.batch+' 單');b.disabled=e.closedBatches.includes(e.batch)||e.status==='ARCHIVED';b.onclick=()=>adminAction('settle',{eventId:e.id,batch:e.batch});bar.append(b);d.append(bar);root.append(d)})}
function activeOrders(){return adminOrders.filter(o=>o.eventId===val('adminEvent')&&o.status==='ACTIVE'&&(val('batchFilter')==='all'||String(o.batch)===val('batchFilter')))}
function linesFor(o){return o.items.filter(i=>!i.cancelled).map(i=>`${i.name}×${i.qty}${i.options.length?' ('+i.options.join('、')+')':''}${i.remark?' 備註:'+i.remark:''}`).join('、')}
function summaryText(){let ev=adminEvents.find(e=>e.id===val('adminEvent'));if(!ev)return'';let os=activeOrders(),sum=new Map(),total=0;os.forEach(o=>{total+=o.total;o.items.filter(i=>!i.cancelled).forEach(i=>{let k=i.name+' '+i.options.join('、')+' '+i.remark;sum.set(k,(sum.get(k)||0)+i.qty)})});let result=`📋 ${ev.date} ${ev.store} 報餐\n總計 ${os.length} 筆／${money(total)}\n\n【餐點統計】\n`+Array.from(sum,([k,v])=>`• ${k}：${v}份`).join('\n');result+='\n\n【人員明細】\n'+os.map(o=>`${o.name}（${o.dept}）${money(o.total)}：${linesFor(o)}`).join('\n');return result}
async function copySummary(){try{await navigator.clipboard.writeText(summaryText());say('已複製 LINE 報餐內容')}catch(e){say('複製失敗，請檢查瀏覽器權限')}}
function renderAdminOrders(){let ev=adminEvents.find(e=>e.id===val('adminEvent')),root=el('adminOrders');root.replaceChildren();if(!ev){el('stats').textContent='請選擇場次';return}let os=adminOrders.filter(o=>o.eventId===ev.id&&(val('batchFilter')==='all'||String(o.batch)===val('batchFilter'))),active=os.filter(o=>o.status==='ACTIVE'),total=active.reduce((s,o)=>s+o.total,0);el('stats').textContent=`有效訂單 ${active.length} 筆｜不重複人數 ${new Set(active.map(o=>o.dept+'|'+o.name)).size} 人｜總金額 ${money(total)}`;let t=document.createElement('table');let tr=document.createElement('tr');['姓名／部門','餐點','金額','狀態','操作'].forEach(x=>tr.append(text('th',x)));t.append(tr);os.forEach(o=>{let r=document.createElement('tr');[o.name+'／'+o.dept,linesFor(o),money(o.total),o.status].forEach(x=>r.append(text('td',x)));let cell=document.createElement('td');if(o.status==='ACTIVE'){let b=text('button','管理員取消');b.className='danger';b.onclick=()=>adminAction('cancelOrder',{id:o.id});cell.append(b)}r.append(cell);t.append(r)});root.append(t)}
function printChecklist(){let ev=adminEvents.find(e=>e.id===val('adminEvent'));if(!ev)return;let root=el('printArea');root.replaceChildren();root.append(text('h2',ev.date+' '+ev.store+' 領餐收款對帳單'));root.append(text('p','列印時間：'+new Date().toLocaleString('zh-TW')));let table=document.createElement('table'),head=document.createElement('tr');['收款','姓名／部門','餐點','金額'].forEach(x=>head.append(text('th',x)));table.append(head);activeOrders().forEach(o=>{let tr=document.createElement('tr');['☐',o.name+'／'+o.dept,linesFor(o),money(o.total)].forEach(x=>tr.append(text('td',x)));table.append(tr)});root.append(table);window.print()}
refresh();
</script></body></html>
